name: Build and Release APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        working-directory: KeyboardApp
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Target App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: target-app-release
          path: KeyboardApp/app/build/outputs/apk/release/app-release.apk

      - name: Upload Admin App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-release
          path: admin/build/outputs/apk/release/admin-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "Keyboard Monitor & Admin Control (Build # ${{ github.run_number }})"
          prerelease: false
          files: |
            KeyboardApp/app/build/outputs/apk/release/app-release.apk
            admin/build/outputs/apk/release/admin-release.apk
